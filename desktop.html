
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="desktop.css">

    <title>YSH OS</title>
</head>

<body>

    <!-- TOP BAR -->
    <div class="topbar">

        <span class="user-pill" id="userName">User</span>

        <span class="os-pill">YSH OS</span>

        <span class="time-pill" id="timeElement">00:00:00</span>

    </div>


    <!-- DESKTOP -->
    <main class="desktop"></main>


    <!-- APP DOCK -->
    <div class="app-dock">

        <button data-open="terminalWindow">
            Terminal
        </button>

        <button data-open="notesWindow">
            Notes
        </button>

        <button data-open="browserWindow">
            Browser
        </button>

        <button data-open="taskManagerWindow">
            Task Manager
        </button>

    </div>


    <!-- WELCOME WINDOW -->
    <section class="window welcome-window" id="welcomeWindow">

        <div class="window-header" id="welcomeWindowheader">

            <span>YSH OS</span>

            <button
                class="close-button"
                data-close="welcomeWindow">
                ×
            </button>

        </div>

        <div class="window-content">

            <h1>Welcome to YSH OS</h1>

            <p>
                Welcome to your desktop.
            </p>

            <p class="hint">
                Drag this window by its header.
            </p>

        </div>

    </section>


    <!-- TERMINAL -->
    <section class="window terminal-window" id="terminalWindow">

        <div class="window-header" id="terminalWindowheader">

            <span>YSH Terminal</span>

            <button
                class="close-button"
                data-close="terminalWindow">
                ×
            </button>

        </div>

        <div class="terminal-content">

            <div>YSH Terminal</div>

            <div class="hint">
                Type <strong>help</strong> for commands.
            </div>

            <div
                class="terminal-output"
                id="terminalOutput">
            </div>

            <div class="terminal-line">

                <span id="terminalUser">user</span>@ysh:~$

                <input
                    id="terminalInput"
                    autocomplete="off"
                >

            </div>

        </div>

    </section>


    <!-- NOTES -->
    <section class="window notes-window" id="notesWindow">

        <div class="window-header" id="notesWindowheader">

            <span>Notes</span>

            <button
                class="close-button"
                data-close="notesWindow">
                ×
            </button>

        </div>

        <div class="window-content notes-content">

            <textarea
                id="notesArea"
                placeholder="Write something...">
            </textarea>

        </div>

    </section>


    <!-- BROWSER -->
    <section class="window browser-window" id="browserWindow">

        <div class="window-header" id="browserWindowheader">

            <span>Browser</span>

            <button
                class="close-button"
                data-close="browserWindow">
                ×
            </button>

        </div>

        <div class="browser-content">

            <form
                id="browserForm"
                class="browser-search">

                <input
                    id="browserInput"
                    type="search"
                    placeholder="Search Google"
                    autocomplete="off"
                >

                <button type="submit">
                    Search
                </button>

                <button
                    type="button"
                    id="browserNewTab">
                    ↗
                </button>

            </form>

            <iframe
                id="browserFrame"
                title="Google Search"
                src="https://www.google.com/webhp?igu=1">
            </iframe>

        </div>

    </section>


    <!-- TASK MANAGER -->
    <section class="window task-window" id="taskManagerWindow">

        <div class="window-header" id="taskManagerWindowheader">

            <span>Task Manager</span>

            <button
                class="close-button"
                data-close="taskManagerWindow">
                ×
            </button>

        </div>

        <div class="window-content">

            <table class="task-table">

                <thead>

                    <tr>
                        <th>Window</th>
                        <th>Status</th>
                        <th></th>
                    </tr>

                </thead>

                <tbody id="taskManagerBody"></tbody>

            </table>

        </div>

    </section>


    <script src="desktop.js"></script>

</body>
</html>
